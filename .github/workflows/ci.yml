name: Run Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "^1"

      - name: Run golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11
          args: --verbose

  test:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        go: ["1.25", "1.26"]
        test-mode: ["normal", "race"]
        include:
          - os: ubuntu-latest
            go-build: ~/.cache/go-build
          - os: macos-latest
            go-build: ~/Library/Caches/go-build
          - os: windows-latest
            go-build: ~\AppData\Local\go-build
    name: ${{ matrix.os }} @ Go ${{ matrix.go }} ${{ matrix.test-mode }}
    runs-on: ${{ matrix.os }}
    env:
      GO111MODULE: on
      GOPROXY: https://proxy.golang.org
    steps:
      - name: Set up Go ${{ matrix.go }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go }}
          cache: false

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Cache Go build and modules
        uses: actions/cache@v6
        with:
          path: |
            ${{ matrix.go-build }}
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ matrix.go }}-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-${{ matrix.go }}-
            ${{ runner.os }}-go-

      - name: Run Tests (Unix)
        if: runner.os != 'Windows'
        run: |
          if [ "${{ matrix.test-mode }}" = "race" ]; then
            make test-race
          else
            make covdata
          fi

      - name: Run Tests (Windows)
        if: runner.os == 'Windows'
        run: |
          if ("${{ matrix.test-mode }}" -eq "race") {
            go test -v -race ./...
          } else {
            go test -v -covermode=count -coverprofile=.coverage/coverage.out ./...
          }
        shell: pwsh

      - name: Upload coverage to Codecov
        if: matrix.test-mode == 'normal'
        uses: codecov/codecov-action@v7
        with:
          files: .coverage/coverage.out
          flags: ${{ matrix.os }},go-${{ matrix.go }},${{ matrix.test-mode }}
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true
